name: Publish NuGet

on:
  push:
    branches:
      - release

concurrency:
  group: publish-nuget-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  core-validation:
    uses: ./.github/workflows/validate-dotnet.yml
    permissions:
      contents: read

  browser-validation:
    uses: ./.github/workflows/validate-browsers.yml
    permissions:
      contents: read

  # Includes the packaged 2.x adoption/forward/cutover matrix on all CI platforms.
  migration-validation:
    uses: ./.github/workflows/validate-migrations.yml
    permissions:
      contents: read

  publish:
    name: Build and publish package
    environment: release
    needs:
      - core-validation
      - browser-validation
      - migration-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Calculate package version
        id: version
        shell: bash
        run: |
          current_version="$(sed -nE 's:.*<Version>([^<]+)</Version>.*:\1:p' Magic.IndexedDb/Magic.IndexedDb.csproj)"
          cli_version="$(dotnet msbuild Magic.IndexedDb.Cli/Magic.IndexedDb.Cli.csproj -nologo -getProperty:Version)"
          if [[ "$current_version" != "$cli_version" ]]; then
            echo "Runtime and CLI source versions must match." >&2
            exit 1
          fi
          published_versions="${RUNNER_TEMP}/magic-indexeddb-versions.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --output "${published_versions}" \
            https://api.nuget.org/v3-flatcontainer/magic.indexeddb/index.json
          package_version="$(
            bash .github/scripts/calculate-package-version.sh \
              "${current_version}" \
              "${published_versions}"
          )"

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "Publishing Magic.IndexedDb ${package_version} from ${GITHUB_SHA}."

      - name: Restore package projects
        run: |
          dotnet restore Magic.IndexedDb/Magic.IndexedDb.csproj
          dotnet restore Magic.IndexedDb.Cli/Magic.IndexedDb.Cli.csproj

      - name: Pack runtime
        run: >-
          bash .github/scripts/pack-nuget.sh
          artifacts
          ${{ steps.version.outputs.package_version }}

      - name: Pack CLI
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: >-
          dotnet pack Magic.IndexedDb.Cli/Magic.IndexedDb.Cli.csproj
          --configuration Release --no-restore --output artifacts
          -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Magic.IndexedDb-${{ steps.version.outputs.package_version }}
          path: artifacts/*.nupkg
          if-no-files-found: error
          overwrite: true

      - name: Request temporary NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish CLI and runtime to NuGet.org
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in Magic.IndexedDb.Cli Magic.IndexedDb; do
            dotnet nuget push "artifacts/$package.$PACKAGE_VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Write release summary
        run: |
          echo "## Published Magic.IndexedDb and Magic.IndexedDb.Cli ${{ steps.version.outputs.package_version }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Source commit: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
